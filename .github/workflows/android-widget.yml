name: Build Meu Dindin Android Widget
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-widget/**'
      - 'api/**'
      - 'index.html'
      - '.github/workflows/android-widget.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p android-widget assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: meu-dindin-widget-debug
          path: android-widget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
